# Step Functions Configuration
# Orchestrates the audit backfill process with parallel execution

Resources:
  # Step Function State Machine for KB Bulk Import
  KBBulkImportStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: ${self:service}-${self:provider.stage}-kb-bulk-import
      RoleArn: !GetAtt StepFunctionsRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "KB Bulk Import State Machine - Processes KB documents in parallel batches",
          "StartAt": "SetKBImportRunning",
          "States": {
            "SetKBImportRunning": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ssm:putParameter",
              "Parameters": {
                "Name": "/genesys/kb_import_running",
                "Value": "true",
                "Overwrite": true
              },
              "Next": "ComputeKBBatches"
            },
            "ComputeKBBatches": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${self:service}-${self:provider.stage}-kbComputeBatches",
                "Payload": {
                  "batchSize": 25
                }
              },
              "ResultPath": "$.batches",
              "Next": "ProcessBatchesInParallel"
            },
            "ProcessBatchesInParallel": {
              "Type": "Map",
              "ItemsPath": "$.batches.Payload.batches",
              "MaxConcurrency": 5,
              "Iterator": {
                "StartAt": "ProcessKBBatch",
                "States": {
                  "ProcessKBBatch": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${self:service}-${self:provider.stage}-kbBatchProcessor",
                      "Payload": {
                        "batch.$": "$"
                      }
                    },
                    "Retry": [
                      {
                        "ErrorEquals": ["States.TaskFailed"],
                        "IntervalSeconds": 30,
                        "MaxAttempts": 3,
                        "BackoffRate": 2.0
                      }
                    ],
                    "End": true
                  }
                }
              },
              "Next": "SetKBImportComplete"
            },
            "SetKBImportComplete": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ssm:putParameter",
              "Parameters": {
                "Name": "/genesys/kb_import_done",
                "Value": "true",
                "Overwrite": true
              },
              "Next": "SetKBImportNotRunning"
            },
            "SetKBImportNotRunning": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ssm:putParameter",
              "Parameters": {
                "Name": "/genesys/kb_import_running",
                "Value": "false",
                "Overwrite": true
              },
              "Next": "KBImportSuccess"
            },
            "KBImportSuccess": {
              "Type": "Succeed",
              "Comment": "KB bulk import completed successfully"
            }
          }
        }

  # Step Function State Machine for Audit Backfill  
  AuditBackfillStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: ${self:service}-${self:provider.stage}-audit-backfill
      RoleArn: !GetAtt StepFunctionsRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Audit Backfill State Machine - Processes historical audit data in parallel windows",
          "StartAt": "SetBackfillRunning",
          "States": {
            "SetBackfillRunning": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ssm:putParameter",
              "Parameters": {
                "Name": "/audit/backfill_running",
                "Value": "true",
                "Overwrite": true
              },
              "Next": "ComputeWindows"
            },
            "ComputeWindows": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${self:service}-${self:provider.stage}-computeWindows",
                "Payload": {
                  "days": 365,
                  "windowType": "monthly"
                }
              },
              "ResultPath": "$.windows",
              "Next": "ProcessWindowsInParallel"
            },
            "ProcessWindowsInParallel": {
              "Type": "Map",
              "ItemsPath": "$.windows.Payload.windows",
              "MaxConcurrency": 5,
              "Iterator": {
                "StartAt": "ProcessWindow",
                "States": {
                  "ProcessWindow": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${self:service}-${self:provider.stage}-backfillProcessor",
                      "Payload.$": "$"
                    },
                    "Retry": [
                      {
                        "ErrorEquals": ["States.TaskFailed"],
                        "IntervalSeconds": 30,
                        "MaxAttempts": 3,
                        "BackoffRate": 2.0
                      }
                    ],
                    "End": true
                  }
                }
              },
              "Next": "SetBackfillComplete"
            },
            "SetBackfillComplete": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ssm:putParameter",
              "Parameters": {
                "Name": "/audit/backfill_checkpoint_iso",
                "Value": "true",
                "Overwrite": true
              },
              "Next": "SetBackfillNotRunning"
            },
            "SetBackfillNotRunning": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ssm:putParameter",
              "Parameters": {
                "Name": "/audit/backfill_running",
                "Value": "false",
                "Overwrite": true
              },
              "Next": "BackfillSuccess"
            },
            "BackfillSuccess": {
              "Type": "Succeed",
              "Comment": "Audit backfill completed successfully"
            }
          }
        }

  # Lambda function to compute time windows for backfill
  ComputeWindowsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: ${self:service}-${self:provider.stage}-computeWindows
      Runtime: nodejs18.x
      Handler: index.handler
      Role: !GetAtt ComputeWindowsRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          /**
           * Computes time windows for audit backfill processing
           * Divides the specified time range into manageable chunks
           */
          exports.handler = async (event) => {
            console.log('Computing windows for backfill:', JSON.stringify(event, null, 2));
            
            const { days = 365, windowType = 'monthly' } = event;
            const now = new Date();
            const startDate = new Date(now.getTime() - (days * 24 * 60 * 60 * 1000));
            
            const windows = [];
            let currentDate = new Date(startDate);
            
            while (currentDate < now) {
              const windowStart = new Date(currentDate);
              let windowEnd;
              
              // Calculate window end based on type
              if (windowType === 'monthly') {
                windowEnd = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
              } else if (windowType === 'weekly') {
                windowEnd = new Date(currentDate.getTime() + (7 * 24 * 60 * 60 * 1000));
              } else { // daily
                windowEnd = new Date(currentDate.getTime() + (24 * 60 * 60 * 1000));
              }
              
              // Ensure we don't go beyond the current time
              if (windowEnd > now) {
                windowEnd = new Date(now);
              }
              
              windows.push({
                startTime: windowStart.toISOString(),
                endTime: windowEnd.toISOString(),
                windowId: `${windowStart.getFullYear()}-${String(windowStart.getMonth() + 1).padStart(2, '0')}`
              });
              
              currentDate = windowEnd;
            }
            
            console.log(`Generated ${windows.length} windows for processing`);
            
            return {
              windows,
              totalWindows: windows.length,
              dateRange: {
                start: startDate.toISOString(),
                end: now.toISOString()
              }
            };
          };

  # IAM Role for Step Functions
  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Lambda invocation permissions
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ComputeWindowsFunction.Arn
                  - !Sub "${BackfillProcessorLambdaFunction.Arn}"
                  - !Sub "${KbComputeBatchesLambdaFunction.Arn}"
                  - !Sub "${KbBatchProcessorLambdaFunction.Arn}"
              
              # SSM parameter permissions
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/audit/*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/genesys/*"
              
              # CloudWatch Logs permissions
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  # IAM Role for Compute Windows Lambda
  ComputeWindowsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # EventBridge Rule to trigger backfill (manual trigger)
  BackfillTriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: ${self:service}-${self:provider.stage}-backfill-trigger
      Description: "Manual trigger for audit backfill process"
      EventPattern:
        source:
          - "custom.audit.backfill"
        detail-type:
          - "Trigger Backfill"
      State: ENABLED
      Targets:
        - Arn: !GetAtt AuditBackfillStateMachine.Arn
          Id: "BackfillStateMachineTarget"
          RoleArn: !GetAtt EventBridgeRole.Arn

  # IAM Role for EventBridge to invoke Step Functions
  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EventBridgeStepFunctionsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !GetAtt AuditBackfillStateMachine.Arn

# Outputs
Outputs:
  AuditBackfillStateMachineArn:
    Description: ARN of the Audit Backfill State Machine
    Value: !GetAtt AuditBackfillStateMachine.Arn
    Export:
      Name: ${self:service}-${self:provider.stage}-BackfillStateMachineArn
      
  ComputeWindowsFunctionArn:
    Description: ARN of the Compute Windows Lambda Function
    Value: !GetAtt ComputeWindowsFunction.Arn
    Export:
      Name: ${self:service}-${self:provider.stage}-ComputeWindowsArn
      
  KBBulkImportStateMachineArn:
    Description: ARN of the KB Bulk Import State Machine
    Value: !GetAtt KBBulkImportStateMachine.Arn
    Export:
      Name: ${self:service}-${self:provider.stage}-KBImportStateMachineArn